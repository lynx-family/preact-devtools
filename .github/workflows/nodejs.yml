name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # Playwright 1.59 does not support Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Deps
        run: npm i
      - name: Check formatting
        run: npm run format:check
      - name: Install Playwright
        run: npx playwright install --with-deps && npx playwright install-deps chromium
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test && npm run test:lynx
      - name: Run Preact 10 e2e tests
        run: npm run build:chrome && npm run test:e2e -- --retries=5
        env:
          PREACT_VERSION: 10
          CI: true
      - name: Run Preact 11 e2e tests
        run: npm run test:e2e -- --retries=5
        env:
          PREACT_VERSION: 11
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
